server:
  port: ${SERVER_PORT:8084}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  application:
    name: proctoring-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${PROCTORING_DB:proctoring_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping:
          session: com.example.common.event.SessionStartedEvent
          answer: com.example.common.event.AnswerSavedEvent
          proctoring: com.example.common.event.SuspiciousActionEvent
          achievement: com.example.common.event.AchievementUnlockedEvent
          notification: com.example.common.event.NotificationEvent
          test: com.example.common.event.TestPublishedEvent
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping:
          session: com.example.common.event.SessionStartedEvent
          answer: com.example.common.event.AnswerSavedEvent
          proctoring: com.example.common.event.SuspiciousActionEvent
          achievement: com.example.common.event.AchievementUnlockedEvent
          notification: com.example.common.event.NotificationEvent
          test: com.example.common.event.TestPublishedEvent
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:localhost:8848}
        enabled: true
        watch:
          enabled: true
          delay: 5000
        naming-client-timeout: 60000
  security:
    enabled: false

logging:
  level:
    org.springframework.web: DEBUG
    org.springdoc: DEBUG
    com.example.proctoring: DEBUG

session:
  service:
    url: ${SESSION_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true