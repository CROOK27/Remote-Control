server:
  port: ${PORT:8082}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

spring:
  application:
    name: analytics-service
  security:
    enabled: false
  nacos:
    discovery:
      server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos:8848}
      watch:
        enabled: true
        delay: 5000
      naming-client-timeout: 60000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: analytics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true
    operationsSorter: method

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  test-management:
    url: ${TEST_MANAGEMENT_URL:http://localhost:8082}
  test-session:
    url: ${TEST_SESSION_URL:http://localhost:8083}
  proctoring:
    url: ${PROCTORING_URL:http://localhost:8084}
  gamification:
    url: ${GAMIFICATION_URL:http://localhost:8085}